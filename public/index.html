<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncWatch Pro</title>
    <script src="https://watchsync-4ga1.onrender.com/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        #app { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .hidden { display: none !important; }
        
        /* Lobby */
        #lobby { text-align: center; margin-top: 50px; }
        input, button, select { padding: 12px; margin: 5px; border-radius: 6px; border: none; font-size: 16px; }
        input, select { background: #333; color: white; border: 1px solid #555; }
        button { background: #e50914; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #f40612; }
        button:disabled { background: #555; cursor: not-allowed; }

        /* Main Layout */
        #watch-screen { display: flex; gap: 20px; flex-wrap: wrap; }
        #player-section { flex: 2; min-width: 300px; }
        #chat-section { flex: 1; min-width: 250px; background: #1e1e1e; border-radius: 8px; display: flex; flex-direction: column; height: 500px; }

        /* Custom Video Player */
        #video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; }
        #video-container { width: 100%; height: 100%; }
        #video-container iframe, #video-container video { width: 100%; height: 100%; border: none; }
        
        /* Custom Controls Overlay */
        #custom-controls { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding: 10px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; }
        #custom-controls button { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }
        #custom-controls button:hover { color: #e50914; }
        #progress-bar { flex-grow: 1; height: 5px; background: #555; border-radius: 5px; cursor: pointer; position: relative; }
        #progress-fill { height: 100%; background: #e50914; width: 0%; border-radius: 5px; }
        #time-display { font-size: 14px; color: #ddd; min-width: 80px; text-align: right; }

        /* Chat */
        #chat-header { padding: 15px; background: #2a2a2a; border-radius: 8px 8px 0 0; font-weight: bold; border-bottom: 1px solid #444; }
        #chat-messages { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #333; padding: 8px 12px; border-radius: 8px; max-width: 85%; word-wrap: break-word; }
        .msg.host { background: #4a1418; align-self: flex-start; }
        .msg.guest { background: #1a3a4a; align-self: flex-end; }
        .msg-time { font-size: 10px; color: #aaa; display: block; margin-top: 4px; }
        #chat-input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #444; }
        #chat-input { flex-grow: 1; background: #333; color: white; border: 1px solid #555; border-radius: 20px; padding: 10px 15px; }
        
        #share-link { background: #222; padding: 10px; border-radius: 5px; color: #4caf50; font-size: 14px; margin-bottom: 15px; word-break: break-all; }
    </style>
</head>
<body>
    <div id="app">
        <h1 style="text-align: center;">🎬 SyncWatch Pro</h1>
        
        <div id="lobby">
            <button onclick="createRoom()">Create New Room (Be Host)</button>
            <p style="color: #888;">- OR -</p>
            <input type="text" id="join-room-id" placeholder="Enter Room ID">
            <button onclick="joinRoom()">Join Room</button>
        </div>

        <div id="watch-screen" class="hidden">
            <div id="player-section">
                <h3>Room: <span id="display-room-id"></span> <span id="host-badge" class="hidden" style="color: gold;">(HOST)</span></h3>
                <div id="share-link" class="hidden">📤 Share: <span id="link-text"></span></div>
                
                <div id="source-inputs" style="margin-bottom: 15px;">
                    <select id="source-type">
                        <option value="youtube">YouTube (URL or ID)</option>
                        <option value="torrent">Torrent (Magnet Link)</option>
                    </select>
                    <input type="text" id="source-id" placeholder="Paste link here" style="width: 300px;">
                    <button onclick="loadSource()">Load Video</button>
                </div>

                <div id="video-wrapper">
                    <div id="video-container"></div>
                    <!-- Custom Controls (Only visible/active for Host) -->
                    <div id="custom-controls" class="hidden">
                        <button id="btn-play-pause" onclick="togglePlay()">▶</button>
                        <div id="progress-bar" onclick="seekVideo(event)">
                            <div id="progress-fill"></div>
                        </div>
                        <span id="time-display">0:00 / 0:00</span>
                    </div>
                </div>
                <p id="status-text" style="color: #aaa; text-align: center; margin-top: 10px;">Waiting for host...</p>
            </div>

            <div id="chat-section">
                <div id="chat-header">💬 Room Chat</div>
                <div id="chat-messages"></div>
                <div id="chat-input-area">
                    <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleChatKey(event)">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
