<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>WatchSync — Watch Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #08090d;
      --surface: #10121a;
      --surface2: #181b26;
      --surface3: #1e2133;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent-glow: rgba(108,99,255,0.35);
      --text: #f0f0f8;
      --text-muted: #7a7d99;
      --text-dim: #4a4d66;
      --host-color: #ffd700;
      --success: #4ade80;
      --danger: #f87171;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --chat-w: 340px;
      --header-h: 64px;
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 99px; }

    .hidden { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; clip: rect(0,0,0,0); }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 9999; opacity: 0.4;
    }

    #lobby {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    #lobby::after {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
      top: -200px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      animation: blobPulse 8s ease-in-out infinite;
    }

    @keyframes blobPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
      50% { transform: translateX(-50%) scale(1.15); opacity: 1; }
    }

    .lobby-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
    }

    .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 32px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    }

    .lobby-logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lobby-tagline {
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 48px;
      position: relative; z-index: 1;
      letter-spacing: 0.3px;
    }

    .lobby-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    .lobby-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(108,99,255,0.06), transparent 60%);
      pointer-events: none;
    }

    .username-field { margin-bottom: 28px; }

    .field-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 16px;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
    }

    input[type="text"]::placeholder { color: var(--text-dim); }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background var(--transition);
    }

    .btn:hover::after { background: rgba(255,255,255,0.07); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b85ff);
      color: #fff;
      width: 100%;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
    }

    .btn-primary:hover { box-shadow: 0 6px 28px rgba(108,99,255,0.55); }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      width: 100%;
    }

    .btn-icon {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: var(--radius-xs);
      min-width: 40px;
      height: 40px;
    }

    .btn-icon:hover { background: var(--surface3); }

    .btn-sm {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: var(--radius-xs);
    }

    .join-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .join-row {
      display: flex;
      gap: 10px;
    }

    .join-row input { flex: 1; }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      padding: 10px 14px;
      background: rgba(248, 113, 113, 0.08);
      border-radius: var(--radius-xs);
      border: 1px solid rgba(248, 113, 113, 0.2);
      display: none;
    }

    .error-msg.show { display: block; }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #app-header {
      height: var(--header-h);
      min-height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 16px;
      position: relative;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .header-logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .header-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .header-room-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .room-id-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition);
      user-select: none;
    }

    .room-id-pill:hover { background: var(--surface3); color: var(--text); }

    .room-id-pill strong {
      color: var(--accent);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .copy-icon { font-size: 11px; opacity: 0.5; }

    .host-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: rgba(255,215,0,0.1);
      border: 1px solid rgba(255,215,0,0.3);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      color: var(--host-color);
      letter-spacing: 0.5px;
    }

    .viewer-count {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .viewer-dot {
      width: 7px; height: 7px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--success);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .header-spacer { flex: 1; }

    #main-content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    #source-bar {
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .source-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .source-input-wrap {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    #source-type-select {
      padding: 9px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      cursor: pointer;
      transition: border-color var(--transition);
      white-space: nowrap;
    }

    #source-type-select:focus { border-color: var(--accent); }

    #source-url {
      flex: 1;
      padding: 9px 14px;
      padding-left: 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-xs);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      min-width: 0;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    #source-url:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.12);
    }

    #video-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    #video-wrapper {
      position: relative;
      width: 100%;
      max-width: 100%;
      background: #000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7);
      aspect-ratio: 16 / 9;
    }

    #video-container {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

    #video-container iframe,
    #video-container video {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    #player-placeholder {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--surface);
      color: var(--text-muted);
      transition: opacity 0.3s;
    }

    .placeholder-icon {
      width: 80px; height: 80px;
      background: var(--surface2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      border: 2px dashed var(--border);
    }

    .placeholder-text { font-size: 15px; text-align: center; line-height: 1.6; }
    .placeholder-text strong { color: var(--text); display: block; margin-bottom: 4px; font-family: 'Syne', sans-serif; }

    #player-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9) 50%, rgba(0,0,0,0.95));
      padding: 40px 16px 14px;
      transform: translateY(0);
      transition: opacity var(--transition);
      opacity: 0;
    }

    #video-wrapper:hover #player-controls { opacity: 1; }
    #video-wrapper.controls-visible #player-controls { opacity: 1; }

    .progress-track {
      position: relative;
      height: 4px;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: height 0.15s;
    }

    .progress-track:hover { height: 6px; }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      width: 0%;
      position: relative;
      transition: width 0.3s linear;
    }

    .progress-bar-fill::after {
      content: '';
      position: absolute;
      right: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px; height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(108,99,255,0.8);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .progress-track:hover .progress-bar-fill::after { opacity: 1; }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.85);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .ctrl-btn.host-only-ctrl { display: none; }
    .is-host .ctrl-btn.host-only-ctrl { display: flex; }

    .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .ctrl-btn:disabled:hover { background: none; }

    .time-display {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
      flex: 1;
    }

    .volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 70px; height: 3px;
      background: rgba(255,255,255,0.2);
      border-radius: 99px;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }

    #guest-notice {
      padding: 8px 20px;
      background: rgba(108,99,255,0.08);
      border-top: 1px solid rgba(108,99,255,0.15);
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    #sync-indicator {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 5px 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 99px;
      font-size: 12px;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.4s;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    #sync-indicator.show { opacity: 1; }
    .sync-dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; }

    #chat-panel {
      width: var(--chat-w);
      min-width: var(--chat-w);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform var(--transition);
    }

    #chat-header {
      padding: 16px 20px;
