<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncWatch</title>
    <script src="https://watchsync-4ga1.onrender.com/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; margin: 0; }
        #app { max-width: 900px; margin: 0 auto; }
        .hidden { display: none !important; }
        input, button, select { padding: 12px; margin: 5px; border-radius: 6px; border: none; font-size: 16px;}
        input, select { background: #333; color: white; border: 1px solid #555; width: 200px;}
        button { background: #e50914; color: white; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button:hover { background: #f40612; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        /* Video Container & Guest Blocker */
        #video-wrapper { 
            position: relative; 
            width: 100%; 
            max-width: 800px; 
            margin: 20px auto; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            aspect-ratio: 16/9;
        }
        #video-container { width: 100%; height: 100%; }
        #video-container video, #video-container iframe { width: 100%; height: 100%; }
        
        /* This blocks guests from clicking the YouTube player */
        #guest-blocker {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; cursor: not-allowed; background: transparent;
        }

        #share-link { background: #222; padding: 15px; word-break: break-all; margin: 15px auto; color: #4caf50; border-radius: 5px; font-weight: bold; border: 1px dashed #4caf50; max-width: 800px;}
        .controls { margin-top: 20px; }
        .status { color: #aaa; font-size: 0.9em; margin-top: 10px; min-height: 20px;}
    </style>
</head>
<body>
    <div id="app">
        <h1>🎬 SyncWatch</h1>
        
        <div id="lobby">
            <button onclick="createRoom()">Create New Room (Be Host)</button>
            <p style="color: #888;">- OR -</p>
            <input type="text" id="join-room-id" placeholder="Enter Room ID">
            <button onclick="joinRoom()">Join Room</button>
        </div>

        <div id="watch-screen" class="hidden">
            <h3>Room: <span id="display-room-id"></span> <span id="host-badge" class="hidden" style="color: gold;">(HOST)</span></h3>
            <div id="share-link" class="hidden">
                📤 Share this link with friends:<br>
                <span id="link-text" style="color: white; font-weight: normal;"></span>
            </div>
            
            <div id="source-inputs">
                <select id="source-type">
                    <option value="youtube">YouTube (URL or ID)</option>
                    <option value="torrent">Torrent (Magnet Link)</option>
                </select>
                <input type="text" id="source-id" placeholder="Paste link here" style="width: 300px;">
                <button id="load-source-btn" onclick="loadSource()">Load Video</button>
            </div>

            <div id="video-wrapper">
                <div id="video-container"></div>
                <div id="guest-blocker" class="hidden"></div>
            </div>

            <div class="controls">
                <button id="btn-play" onclick="sendAction('play')" disabled>▶ Play</button>
                <button id="btn-pause" onclick="sendAction('pause')" disabled>⏸ Pause</button>
                <p id="status-text" class="status">Waiting for host...</p>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
